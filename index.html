function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(INITIAL_DATA));
  } catch (e) { return JSON.parse(JSON.stringify(INITIAL_DATA)); }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function sanitize(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function normalizeArabicInput(str) {
  const map = { 'ض':'q','ص':'w','ث':'e','ق':'r','ف':'t','غ':'y','ع':'u','ه':'i','خ':'o','ح':'p','ش':'a','س':'s','ي':'d','ب':'f','ل':'g','ا':'h','ت':'j','ن':'k','م':'l','ئ':'z','ء':'x','ؤ':'c','ر':'v','لا':'b','ى':'n','ة':'m','٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9' };
  return str.split('').map(c => map[c] || c).join('');
}

function formatDirectImageUrl(url) {
  if (!url) return '';
  const m = url.match(/(?:\/d\/|id=)([a-zA-Z0-9_-]{25,})/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}` : url;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.add('hidden'), 2800);
}

function isStoreOpen() {
  try {
    const now = new Date();
    const cur = now.getHours() * 60 + now.getMinutes();
    const [oh, om] = state.settings.openTime.split(':').map(Number);
    const [ch, cm] = state.settings.closeTime.split(':').map(Number);
    const openM = oh * 60 + om, closeM = ch * 60 + cm;
    if (closeM < openM) return cur >= openM || cur <= closeM;
    return cur >= openM && cur <= closeM;
  } catch { return true; }
}

function renderApp() {
  const s = state.settings;
  document.getElementById('restName').textContent = s.name;
  document.getElementById('footerName').textContent = s.name;
  document.getElementById('restDesc').textContent = s.desc;
  document.getElementById('footerAddress').textContent = `${s.address} • مواعيد العمل: ${s.openTime} - ${s.closeTime}`;
  document.getElementById('callBtn').href = `tel:${s.phone}`;

  const banner = document.getElementById('bannerImg');
  if (s.bannerUrl) { banner.src = formatDirectImageUrl(s.bannerUrl); banner.classList.remove('hidden'); }
  else { banner.classList.add('hidden'); }

  const logoBox = document.getElementById('logoBox');
  if (s.logoUrl) {
    logoBox.innerHTML = `<img src="${sanitize(formatDirectImageUrl(s.logoUrl))}" onerror="window.handleImgError(this)" class="w-full h-full object-cover">`;
  } else {
    logoBox.innerHTML = `<i data-lucide="sandwich" class="w-8 h-8 stroke-[2.5]"></i>`;
  }

  const open = isStoreOpen();
  const badge = document.getElementById('statusBadge');
  badge.textContent = open ? 'مفتوح الآن' : 'مغلق حالياً';
  badge.className = `text-[11px] font-bold px-2 py-0.5 rounded-full border ${open ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-red-500/20 text-red-400 border-red-500/30'}`;

  // Social links
  const soc = document.getElementById('socialLinks');
  let socHtml = '';
  if (s.facebook) socHtml += `<a href="${sanitize(s.facebook)}" target="_blank" class="p-2 rounded-lg bg-zinc-800 text-zinc-300 hover:text-yellow-400"><i data-lucide="facebook" class="w-4 h-4"></i></a>`;
  if (s.instagram) socHtml += `<a href="${sanitize(s.instagram)}" target="_blank" class="p-2 rounded-lg bg-zinc-800 text-zinc-300 hover:text-yellow-400"><i data-lucide="instagram" class="w-4 h-4"></i></a>`;
  if (s.mapUrl) socHtml += `<a href="${sanitize(s.mapUrl)}" target="_blank" class="p-2 rounded-lg bg-zinc-800 text-zinc-300 hover:text-yellow-400"><i data-lucide="map-pin" class="w-4 h-4"></i></a>`;
  soc.innerHTML = socHtml;

  // Categories
  const cats = ['الكل', ...state.categories];
  document.getElementById('catTabs').innerHTML = cats.map(c => `
    <button onclick="window.selectCat('${sanitize(c)}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${selectedCat === c ? 'bg-yellow-400 text-zinc-950 shadow' : 'bg-zinc-800/90 text-zinc-300 hover:bg-zinc-700'}">${sanitize(c)}</button>
  `).join('');

  window.renderMenu();
  updateCartBar();
  lucide.createIcons();
}

window.selectCat = function(c) { selectedCat = c; renderApp(); };

window.selectSize = function(idx) {
  window._curCustom.priceIdx = idx;
  window._curCustom.item.prices.forEach((_, i) => {
    const b = document.getElementById(`sizeBtn_${i}`);
    if (b) b.className = `p-2.5 rounded-xl border text-xs font-bold flex justify-between items-center ${i === idx ? 'border-yellow-400 bg-yellow-400/10 text-yellow-300' : 'border-zinc-700 bg-zinc-800/60 text-zinc-300'}`;
  });
  updateCustomTotal();
};

window.toggleAddon = function(id) {
  const arr = window._curCustom.addons;
  const idx = arr.indexOf(id);
  if (idx > -1) arr.splice(idx, 1); else arr.push(id);
  updateCustomTotal();
};

window.changeCustomQty = function(d) {
  window._curCustom.qty = Math.max(1, window._curCustom.qty + d);
  document.getElementById('customQty').textContent = window._curCustom.qty;
  updateCustomTotal();
};

function updateCustomTotal() {
  const c = window._curCustom;
  const base = c.item.prices[c.priceIdx].price;
  const addSum = c.addons.reduce((s, id) => s + (state.addons.find(a => a.id === id)?.price || 0), 0);
  const total = (base + addSum) * c.qty;
  document.getElementById('confirmAddBtn').textContent = `إضافة للسلة (${total} ج.م)`;
}

window.confirmAddToCart = function() {
  const c = window._curCustom;
  const sizeObj = c.item.prices[c.priceIdx];
  const addonObjs = c.addons.map(id => state.addons.find(a => a.id === id)).filter(Boolean);
  const unitPrice = sizeObj.price + addonObjs.reduce((s, a) => s + a.price, 0);
  cart.push({
    uid: Date.now() + Math.random(),
    name: c.item.name,
    size: sizeObj.label,
    addons: addonObjs,
    unitPrice,
    qty: c.qty,
    note: document.getElementById('customNote').value.trim()
  });
  window.closeModal();
  updateCartBar();
  showToast('تمت إضافة الصنف إلى السلة 🍔');
};

function updateCartBar() {
  const bar = document.getElementById('cartBar');
  if (viewOnlyMode || !cart.length) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  const count = cart.reduce((s, i) => s + i.qty, 0);
  const sub = cart.reduce((s, i) => s + i.unitPrice * i.qty, 0);
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = `${sub} ج.م`;
}

window.setOrderType = function(type) {
  orderType = type;
  window.openCart();
};

window.openCart = function() {

  const grandTotal = Math.max(0, sub + deliveryFee - discount);

  document.getElementById('modalContainer').innerHTML = `
  <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-40 flex items-end sm:items-center justify-center p-0 sm:p-4">

          <button onclick="window.setOrderType('delivery')" class="py-2 px-1 rounded-xl text-xs font-black transition ${orderType === 'delivery' ? 'bg-yellow-400 text-zinc-950' : 'text-zinc-400 hover:text-white'}">🛵 دليفري</button>

            <div class="bg-zinc-900/90 border border-zinc-800 p-3 rounded-xl flex justify-between items-center gap-2">

                ${it.addons.length ? `<div class="text-[10px] text-zinc-400">+ ${it.addons.map(a => sanitize(a.name)).join('، ')}</div>` : ''}
                ${it.note ? `<div class="text-[10px] text-amber-300">ملاحظة: ${sanitize(it.note)}</div>` : ''}

              </div>
              <div class="flex items-center gap-1.5 bg-zinc-800 rounded-lg px-1.5 py-1">
                <button onclick="window.updateCartQty(${idx}, -1)" class="w-6 h-6 text-zinc-300 font-bold">-</button>
                <span class="text-xs font-black text-white px-1">${it.qty}</span>
                <button onclick="window.updateCartQty(${idx}, 1)" class="w-6 h-6 text-yellow-400 font-bold">+</button>
              </div>
            </div>`).join('')}
        </div>

        <!-- Customer Details Form -->
        <div class="space-y-2.5 bg-zinc-900/60 p-3 rounded-2xl border border-zinc-800">
          ${orderType === 'dinein' ? `
            <div>
              <label class="block text-xs font-bold text-yellow-400 mb-1">رقم الطاولة *</label>
              <input id="custTable" type="text" placeholder="مثال: طاولة 5" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white">
            </div>
            <input id="custName" type="text" placeholder="الاسم (اختياري)" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white">
          ` : `
            <input id="custName" type="text" placeholder="الاسم بالكامل *" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white">
            <input id="custPhone" type="tel" placeholder="رقم الموبايل *" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white">
          `}
          ${orderType === 'delivery' ? `
            <div>
              <label class="block text-xs font-bold text-zinc-300 mb-1">منطقة التوصيل:</label>
              <select onchange="selectedZoneId = this.value; window.openCart();" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white">
                ${state.zones.map(z => `<option value="${z.id}" ${z.id == selectedZoneId ? 'selected' : ''}>${sanitize(z.name)} (+${z.fee} ج.م)</option>`).join('')}

            </div>
            <div class="flex gap-2">
              <input id="custAddress" type="text" placeholder="العنوان بالتفصيل (شارع / عمارة / شقة) *" class="flex-1 bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white">
              <button onclick="window.getGPS()" type="button" class="px-3 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-yellow-400 border border-zinc-700 text-xs font-bold flex items-center gap-1 flex-shrink-0">
                <i data-lucide="map-pin" class="w-3.5 h-3.5"></i><span>${gpsCoords ? 'تم التحديد' : 'GPS'}</span>
              </button>
            </div>
          ` : ''}
          <div>
            <label class="block text-xs font-bold text-zinc-300 mb-1">طريقة الدفع:</label>
            <select id="payMethod" onchange="document.getElementById('instapayBox').classList.toggle('hidden', this.value !== 'instapay')" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white">
              <option value="cash">كاش عند الاستلام</option>
              <option value="instapay">إنستاباي / محفظة إلكترونية</option>
            </select>
            <div id="instapayBox" class="hidden mt-2 p-2.5 rounded-xl bg-yellow-400/10 border border-yellow-400/30 flex items-center justify-between">
              <span class="text-[11px] text-yellow-200 font-bold">حساب التحويل: ${sanitize(state.settings.instapay)}</span>
              <button onclick="window.copyText('${sanitize(state.settings.instapay)}')" class="text-[10px] bg-yellow-400 text-zinc-950 font-black px-2 py-1 rounded-lg">نسخ</button>

        <div class="flex gap-2">
          <input id="couponInput" type="text" placeholder="كود الخصم (مثال: KING10)" value="${appliedCoupon ? appliedCoupon.code : ''}" class="flex-1 bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white uppercase">

      </div>
      <div class="p-4 border-t border-zinc-800 bg-zinc-900 flex-shrink-0">
        <button onclick="window.sendWhatsAppOrder(${sub}, ${deliveryFee}, ${discount}, ${grandTotal})" class="w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-black py-3.5 rounded-xl text-sm flex items-center justify-center gap-2 transition">
          <i data-lucide="send" class="w-4 h-4"></i><span>إرسال الطلب عبر واتساب (${grandTotal} ج.م)</span>
        </button>
      </div>

window.updateCartQty = function(idx, d) {
  cart[idx].qty += d;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  updateCartBar();
  if (!cart.length) window.closeModal(); else window.openCart();
};

window.getGPS = function() {
  if (!navigator.geolocation) return showToast('المتصفح لا يدعم تحديد الموقع');
  showToast('جاري تحديد موقعك...');
  navigator.geolocation.getCurrentPosition(
    pos => { gpsCoords = `${pos.coords.latitude},${pos.coords.longitude}`; showToast('تم التقاط إحداثيات GPS بنجاح 📍'); window.openCart(); },
    () => showToast('تعذر الوصول للموقع، يرجى كتابة العنوان يدوياً')
  );
};

window.applyCoupon = function() {
  const code = document.getElementById('couponInput').value.trim().toUpperCase();
  const found = state.coupons.find(c => c.code.toUpperCase() === code);
  if (!found) { appliedCoupon = null; showToast('كود الخصم غير صحيح'); }
  else { appliedCoupon = found; showToast(`تم تفعيل خصم ${found.code} 🎉`); }
  window.openCart();
};

window.sendWhatsAppOrder = function(sub, deliveryFee, discount, grandTotal) {
  const name = document.getElementById('custName')?.value.trim() || '';
  const phone = document.getElementById('custPhone')?.value.trim() || '';
  const table = document.getElementById('custTable')?.value.trim() || '';
  const address = document.getElementById('custAddress')?.value.trim() || '';
  const pay = document.getElementById('payMethod')?.value === 'instapay' ? 'إنستاباي / محفظة' : 'كاش';

  if (orderType === 'dinein' && !table) return showToast('يرجى إدخال رقم الطاولة');
  if (orderType !== 'dinein' && (!name || !phone)) return showToast('يرجى إدخال الاسم ورقم الموبايل');
  if (orderType === 'delivery' && !address) return showToast('يرجى إدخال عنوان التوصيل');

  const typeLabel = orderType === 'dinein' ? `داخل المطعم (طاولة: ${table})` : orderType === 'takeaway' ? 'استلام من الفرع (تيك أواي)' : 'توصيل دليفري';
  const zone = state.zones.find(z => z.id == selectedZoneId);

  let msg = `*طلب جديد - ${state.settings.name}* 🍔\n`;
  msg += `نوع الطلب: *${typeLabel}*\n`;
  if (name) msg += `العميل: ${name}\n`;
  if (phone) msg += `الموبايل: ${phone}\n`;
  if (orderType === 'delivery') {
    msg += `المنطقة: ${zone?.name || ''}\nالعنوان: ${address}\n`;
    if (gpsCoords) msg += `الموقع GPS: https://maps.google.com/?q=${gpsCoords}\n`;
  }
  msg += `طريقة الدفع: ${pay}\n-------------------\n`;
  cart.forEach((it, i) => {
    msg += `${i + 1}. *${it.name}* (${it.size}) × ${it.qty} = ${it.unitPrice * it.qty} ج.م\n`;
    if (it.addons.length) msg += `   + إضافات: ${it.addons.map(a => a.name).join('، ')}\n`;
    if (it.note) msg += `   * ملاحظة: ${it.note}\n`;
  });
  msg += `-------------------\nالمجموع: ${sub} ج.م\n`;
  if (deliveryFee) msg += `التوصيل: ${deliveryFee} ج.م\n`;
  if (discount) msg += `الخصم: -${discount} ج.م\n`;
  msg += `*الإجمالي المطلوب: ${grandTotal} ج.م*`;

  const wa = state.settings.whatsapp.replace(/\D/g, '');
  window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`, '_blank');
};

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

window.uploadCompressedImg = function(input, field) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 800, scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale; canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      state.settings[field] = canvas.toDataURL('image/jpeg', 0.75);
      saveState(); renderApp(); showToast('تم ضغط ورفع الصورة بنجاح 🖼️');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
};

window.addCoupon = function() {
  const code = document.getElementById('c_code').value.trim().toUpperCase();
  const value = Number(document.getElementById('c_val').value) || 0;
  if (!code || !value) return;
  state.coupons.push({ code, type: 'percent', value });
  saveState(); renderAdminModal();
};

window.unlockLicense = function() {
  if (document.getElementById('licenseKeyInput').value.trim() === LICENSE_SECRET) {
    window._licenseUnlocked = true;
    renderAdminModal();
    showToast('تم فتح إعدادات الترخيص');
  } else showToast('كود الترخيص غير صحيح');
};

window.toggleLicenseMode = function() {
  viewOnlyMode = !viewOnlyMode;
  localStorage.setItem('mt_license_override', String(viewOnlyMode));
  cart = [];
  renderApp(); renderAdminModal();
  showToast(`تم التبديل إلى: ${viewOnlyMode ? 'باقة العرض الذكي' : 'باقة الطلبات Pro'}`);
};

window.exportExcel = function() {
  const wb = XLSX.utils.book_new();
  const menuRows = state.items.map(it => ({
    'القسم': it.cat, 'اسم الصنف': it.name, 'الوصف': it.desc,
    'الأسعار': it.prices.map(p => `${p.label}:${p.price}`).join('|'),
    'رابط الصورة': it.img, 'الشارة': it.badge || ''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(menuRows), 'المنيو');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.zones.map(z => ({ 'المنطقة': z.name, 'الرسوم': z.fee }))), 'مناطق التوصيل');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.addons.map(a => ({ 'الإضافة': a.name, 'السعر': a.price }))), 'الإضافات');
  const s = state.settings;
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{
    'اسم المطعم': s.name, 'الوصف': s.desc, 'الهاتف': s.phone, 'واتساب': s.whatsapp,
    'العنوان': s.address, 'الفتح': s.openTime, 'الإغلاق': s.closeTime, 'الغلاف': s.bannerUrl,
    'فيسبوك': s.facebook, 'انستجرام': s.instagram, 'الخريطة': s.mapUrl, 'الكوبونات': s.couponsEnabled ? 'نعم' : 'لا'
  }]), 'الإعدادات');
  XLSX.writeFile(wb, 'manzouma_menu_master_template.xlsx');
};

window.importExcel = function(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      applyWorkbookData(wb);
      showToast('تم استيراد ملف Excel بنجاح ✅');
    } catch { showToast('حدث خطأ في قراءة ملف Excel'); }
  };
  reader.readAsArrayBuffer(file);
};

function applyWorkbookData(wb) {
  if (wb.Sheets['المنيو']) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets['المنيو']);
    if (rows.length) {
      state.items = rows.map((r, i) => {
        const rawPrices = String(r['الأسعار'] || '100').split('|').map(p => {
          const [lbl, pr] = p.includes(':') ? p.split(':') : ['عادي', p];
          return { label: lbl.trim(), price: Number(pr) || 0 };
        });
        return {
          id: Date.now() + i, cat: r['القسم'] || 'عام', name: r['اسم الصنف'] || 'صنف',
          desc: r['الوصف'] || '', prices: rawPrices, img: r['رابط الصورة'] || '', badge: r['الشارة'] || ''
        };
      });
      state.categories = [...new Set(state.items.map(i => i.cat))];
    }
  }
  if (wb.Sheets['مناطق التوصيل']) {
    const zRows = XLSX.utils.sheet_to_json(wb.Sheets['مناطق التوصيل']);
    if (zRows.length) state.zones = zRows.map((r, i) => ({ id: i + 1, name: r['المنطقة'], fee: Number(r['الرسوم']) || 0 }));
  }
  if (wb.Sheets['الإضافات']) {
    const aRows = XLSX.utils.sheet_to_json(wb.Sheets['الإضافات']);
    if (aRows.length) state.addons = aRows.map((r, i) => ({ id: i + 1, name: r['الإضافة'], price: Number(r['السعر']) || 0 }));
  }
  if (wb.Sheets['الإعدادات']) {
    const sRow = XLSX.utils.sheet_to_json(wb.Sheets['الإعدادات'])[0];
    if (sRow) {
      Object.assign(state.settings, {
        name: sRow['اسم المطعم'] || state.settings.name,
        desc: sRow['الوصف'] || state.settings.desc,
        phone: String(sRow['الهاتف'] || state.settings.phone),
        whatsapp: String(sRow['واتساب'] || state.settings.whatsapp),
        address: sRow['العنوان'] || state.settings.address,
        bannerUrl: sRow['الغلاف'] || state.settings.bannerUrl,
        facebook: sRow['فيسبوك'] || '', instagram: sRow['انستجرام'] || '', mapUrl: sRow['الخريطة'] || ''
      });
    }
  }
  saveState(); renderApp(); renderAdminModal();
}

window.syncGoogleSheet = async function() {
  const url = document.getElementById('gsheetUrl').value.trim();
  const m = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if (!m) return showToast('رابط Google Sheet غير صالح');
  const exportUrl = `https://docs.google.com/spreadsheets/d/${m[1]}/export?format=xlsx`;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 6000);
  try {
    showToast('جاري المزامنة السحابية...');
    let res;
    try { res = await fetch(exportUrl, { signal: ctrl.signal }); }
    catch { res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(exportUrl)}`, { signal: ctrl.signal }); }
    clearTimeout(timer);
    const buf = await res.arrayBuffer();
    applyWorkbookData(XLSX.read(buf, { type: 'array' }));
    showToast('تمت المزامنة مع Google Sheets بنجاح ☁️');
  } catch { showToast('تعذر الاتصال بالشيت، تأكد أنه متاح للعامة'); }
};

window.exportHtml = function() {
  const docHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([docHtml], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.html';
  a.click();
};

window.factoryReset = function() {
  localStorage.removeItem(STORAGE_KEY);
  state = JSON.parse(JSON.stringify(INITIAL_DATA));
  saveState(); renderApp(); renderAdminModal();
  showToast('تمت استعادة البيانات الأصلية');
};

window.onload = renderApp;
</script>
